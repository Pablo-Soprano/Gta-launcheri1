name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find project
        id: p
        run: |
          f=$(find . -name settings.gradle | head -1)
          if [ -z "$f" ]; then
            echo "settings.gradle NOT FOUND. Files in repo:"
            find . -not -path "./.git/*" | head -60
            exit 1
          fi
          echo "dir=$(dirname $f)" >> $GITHUB_OUTPUT
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
      - run: gradle assembleDebug --no-daemon
        working-directory: ${{ steps.p.outputs.dir }}
      - uses: actions/upload-artifact@v4
        with:
          name: GeoLifeRP-Launcher-APK
          path: ${{ steps.p.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
